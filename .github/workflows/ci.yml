name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      AGENTIC_TEST_POSTGRES_DSN: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tools tests human_agent_collaboration.py workflow_experiment.py
      - name: Pytest
        run: pytest -q
      - name: Legacy deterministic demo smoke
        run: python -m src.demo
      - name: Governed runtime import smoke
        run: python -c "from src.governed_runtime import GovernedAgentRuntime, ToolRegistry; GovernedAgentRuntime(ToolRegistry())"

  postgres-failover:
    runs-on: ubuntu-latest
    needs: quality
    env:
      PRIMARY_DSN: postgresql://postgres:test-only-password@127.0.0.1:55432/postgres
      PROMOTED_DSN: postgresql://postgres:test-only-password@127.0.0.1:55433/postgres
      AGENTIC_FAILOVER_SIGNING_SECRET: test-only-authority-failover-signing-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Start disposable streaming-replication topology
        run: |
          docker compose -f deploy/postgres-failover/compose.yml up -d --wait --wait-timeout 120
          docker compose -f deploy/postgres-failover/compose.yml exec -T primary \
            psql -U postgres -c "ALTER SYSTEM SET synchronous_standby_names = 'authority_standby'"
          docker compose -f deploy/postgres-failover/compose.yml exec -T primary \
            psql -U postgres -c "SELECT pg_reload_conf()"
      - name: Replicate authority checkpoint
        run: |
          python tools/postgres_authority_failover_drill.py prepare \
            --primary-dsn "$PRIMARY_DSN" \
            --replica-dsn "$PROMOTED_DSN" \
            --evidence .artifacts/postgres-failover-prepared.json
      - name: Isolate old primary and promote standby
        run: |
          docker compose -f deploy/postgres-failover/compose.yml stop -t 15 primary
          docker compose -f deploy/postgres-failover/compose.yml exec -T --user postgres standby \
            pg_ctl promote -D /var/lib/postgresql/data -w -t 30
      - name: Verify recovery and advance checkpoint
        run: |
          python tools/postgres_authority_failover_drill.py verify \
            --old-primary-dsn "$PRIMARY_DSN" \
            --promoted-dsn "$PROMOTED_DSN" \
            --prepared-evidence .artifacts/postgres-failover-prepared.json \
            --evidence .artifacts/postgres-failover-verified.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-authority-failover-evidence
          path: .artifacts/postgres-failover-*.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Show topology logs on failure
        if: failure()
        run: docker compose -f deploy/postgres-failover/compose.yml logs --no-color
      - name: Remove disposable topology
        if: always()
        run: docker compose -f deploy/postgres-failover/compose.yml down -v
