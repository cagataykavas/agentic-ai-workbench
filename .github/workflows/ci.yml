name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      AGENTIC_TEST_POSTGRES_DSN: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tools tests human_agent_collaboration.py workflow_experiment.py
      - name: Pytest
        run: pytest -q
      - name: Legacy deterministic demo smoke
        run: python -m src.demo
      - name: Governed runtime import smoke
        run: python -c "from src.governed_runtime import GovernedAgentRuntime, ToolRegistry; GovernedAgentRuntime(ToolRegistry())"
