name: attest failover evidence

on:
  workflow_call:

jobs:
  attest:
    runs-on: ubuntu-latest
    environment: failover-evidence-signer
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install evidence auditor
        run: pip install --no-deps -e .
      - name: Download unsigned evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: postgres-authority-failover-evidence
          path: .artifacts
      - name: Re-audit evidence inside signer boundary
        run: |
          python tools/postgres_authority_failover_drill.py audit \
            --prepared-evidence .artifacts/postgres-failover-prepared.json \
            --verified-evidence .artifacts/postgres-failover-verified.json
      - name: Attest audited evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .artifacts/postgres-failover-*.json
